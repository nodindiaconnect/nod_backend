<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Standard Checkout - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-6">
      <!-- Header -->
      <div class="text-center">
        <div
          class="inline-flex items-center justify-center w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full mb-3"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Razorpay Checkout Test</h2>
        <p class="text-sm text-gray-500 mt-1">
          Test Order Creation & Backend Signature Verification
        </p>
      </div>

      <!-- Amount input form -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Amount (in INR ₹)</label
          >
          <div class="relative rounded-md shadow-sm">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <span class="text-gray-500 sm:text-sm">₹</span>
            </div>
            <input
              type="number"
              id="amount-input"
              value="500"
              min="1"
              class="block w-full pl-8 pr-12 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 font-semibold text-lg"
              placeholder="500"
            />
            <div
              class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"
            >
              <span class="text-gray-400 text-sm">INR</span>
            </div>
          </div>
          <p class="text-xs text-gray-400 mt-1" id="paise-display">
            = 50000 paise
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Receipt ID (Optional)</label
          >
          <input
            type="text"
            id="receipt-input"
            value="rcpt_test_001"
            class="block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>

        <!-- Pay Now Button -->
        <button
          id="pay-now-btn"
          onclick="initiatePayment()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-150 ease-in-out flex items-center justify-center space-x-2"
        >
          <span id="btn-text">Pay Now</span>
          <svg
            id="btn-spinner"
            class="hidden animate-spin h-5 w-5 text-white"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Status Alerts -->
      <div id="status-box" class="hidden rounded-xl p-4 text-sm"></div>

      <!-- Step Progress Log -->
      <div class="border-t pt-4">
        <h3
          class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2"
        >
          Live Progress Logs
        </h3>
        <div
          id="log-box"
          class="bg-gray-900 text-gray-100 rounded-lg p-3 text-xs font-mono h-48 overflow-y-auto space-y-1"
        >
          <p class="text-gray-500">// Ready to start payment test...</p>
        </div>
      </div>
    </div>

    <script>
      const amountInput = document.getElementById("amount-input");
      const paiseDisplay = document.getElementById("paise-display");
      const payBtn = document.getElementById("pay-now-btn");
      const btnText = document.getElementById("btn-text");
      const btnSpinner = document.getElementById("btn-spinner");
      const statusBox = document.getElementById("status-box");
      const logBox = document.getElementById("log-box");

      amountInput.addEventListener("input", () => {
        const val = parseFloat(amountInput.value) || 0;
        paiseDisplay.innerText = `= ${(val * 100).toFixed(0)} paise`;
      });

      function log(msg, type = "info") {
        const colors = {
          info: "text-blue-400",
          success: "text-green-400",
          error: "text-red-400",
          warn: "text-yellow-400",
        };
        const time = new Date().toLocaleTimeString();
        const p = document.createElement("p");
        p.className = colors[type] || "text-gray-300";
        p.innerText = `[${time}] ${msg}`;
        logBox.appendChild(p);
        logBox.scrollTop = logBox.scrollHeight;
      }

      function showStatus(message, isSuccess) {
        statusBox.classList.remove(
          "hidden",
          "bg-green-50",
          "text-green-800",
          "bg-red-50",
          "text-red-800",
        );
        if (isSuccess) {
          statusBox.classList.add(
            "bg-green-50",
            "text-green-800",
            "border",
            "border-green-200",
          );
          statusBox.innerHTML = `<strong>Success!</strong> ${message}`;
        } else {
          statusBox.classList.add(
            "bg-red-50",
            "text-red-800",
            "border",
            "border-red-200",
          );
          statusBox.innerHTML = `<strong>Error!</strong> ${message}`;
        }
      }

      function setLoading(isLoading) {
        if (isLoading) {
          payBtn.disabled = true;
          btnText.innerText = "Processing...";
          btnSpinner.classList.remove("hidden");
        } else {
          payBtn.disabled = false;
          btnText.innerText = "Pay Now";
          btnSpinner.classList.add("hidden");
        }
      }

      async function initiatePayment() {
        const amountInRupees = parseFloat(amountInput.value);
        if (!amountInRupees || amountInRupees <= 0) {
          alert("Please enter a valid amount!");
          return;
        }

        const amountInPaise = Math.round(amountInRupees * 100);
        const receipt =
          document.getElementById("receipt-input").value.trim() ||
          `rcpt_${Date.now()}`;

        setLoading(true);
        const API_BASE =
          window.location.protocol === "file:" || !window.location.host
            ? "http://localhost:3002"
            : "";
        log(
          `Calling POST ${API_BASE}/api/create-order for amount: ₹${amountInRupees} (${amountInPaise} paise)...`,
        );

        try {
          // Step 1: Call Backend to Create Order
          const orderRes = await fetch(`${API_BASE}/api/create-order`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: amountInPaise,
              currency: "INR",
              receipt: receipt,
            }),
          });

          const orderData = await orderRes.json();
          log(
            `Create-order response: ${JSON.stringify(orderData)}`,
            orderData.success ? "success" : "error",
          );

          if (!orderData.success) {
            throw new Error(
              orderData.message || "Failed to create Razorpay order",
            );
          }

          const orderId = orderData.order_id || orderData.data?.order_id;
          const keyId = orderData.key_id || orderData.data?.key_id;

          log(`Order created successfully! Order ID: ${orderId}`, "success");
          log(`Opening Razorpay Checkout Popup...`);

          // Step 2: Configure & Open Razorpay Standard Checkout
          const options = {
            key: keyId,
            amount: amountInPaise,
            currency: "INR",
            name: "Nod India Connect",
            description: "Test Transaction",
            order_id: orderId,
            handler: async function (response) {
              log("Payment completed on Razorpay modal!", "info");
              log(
                `razorpay_payment_id: ${response.razorpay_payment_id}`,
                "info",
              );
              log(`razorpay_order_id: ${response.razorpay_order_id}`, "info");
              log(
                `razorpay_signature received. Calling POST ${API_BASE}/api/verify-payment...`,
                "info",
              );

              // Step 3: Call Backend to Verify Payment Signature
              try {
                const verifyRes = await fetch(
                  `${API_BASE}/api/verify-payment`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      razorpay_order_id: response.razorpay_order_id,
                      razorpay_payment_id: response.razorpay_payment_id,
                      razorpay_signature: response.razorpay_signature,
                    }),
                  },
                );

                const verifyData = await verifyRes.json();
                log(
                  `Verify-payment response: ${JSON.stringify(verifyData)}`,
                  verifyData.success ? "success" : "error",
                );

                if (verifyData.success && verifyData.verified) {
                  log(
                    "Payment Signature Verified by Backend Successfully!",
                    "success",
                  );
                  showStatus(
                    `Payment verified successfully! Payment ID: <code>${response.razorpay_payment_id}</code>`,
                    true,
                  );
                } else {
                  log(
                    `Payment verification failed: ${verifyData.message}`,
                    "error",
                  );
                  showStatus(
                    `Verification Failed: ${verifyData.message}`,
                    false,
                  );
                }
              } catch (vErr) {
                log(`Verification error: ${vErr.message}`, "error");
                showStatus(`Verification Error: ${vErr.message}`, false);
              } finally {
                setLoading(false);
              }
            },
            modal: {
              ondismiss: function () {
                log("Payment modal closed by user", "warn");
                setLoading(false);
              },
            },
            prefill: {
              name: "Test User",
              email: "test.user@example.com",
              contact: "9999999999",
            },
            theme: {
              color: "#4f46e5",
            },
          };

          const rzp = new Razorpay(options);
          rzp.on("payment.failed", function (failResponse) {
            log(`Payment Failed: ${failResponse.error.description}`, "error");
            showStatus(
              `Payment Failed: ${failResponse.error.description}`,
              false,
            );
            setLoading(false);
          });

          rzp.open();
        } catch (err) {
          log(`Error: ${err.message}`, "error");
          showStatus(err.message, false);
          setLoading(false);
        }
      }
    </script>
  </body>
</html>
